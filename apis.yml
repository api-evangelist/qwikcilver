aid: qwikcilver
name: QwikCilver
description: 'QwikCilver is India''s largest gift card and prepaid commerce company, founded in 2006 and
  acquired by Pine Labs in 2019. It powers gift card issuance, distribution, and redemption for retailers,
  banks, and enterprises, and operates the consumer and corporate gifting marketplace Woohoo (woohoo.in),
  which sells digital and physical gift cards from 300+ brands. Its API platform (hosted on woohoo.in)
  lets partners programmatically browse catalogs, place bulk gift card orders, activate and redeem cards,
  check balances, and run reward, incentive, and channel-engagement programs. QwikCilver is an Accel
  portfolio company in the consumer / fintech sector.'
